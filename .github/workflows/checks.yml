name: Checks

on:
  # Every pull request runs this workflow so the required `required-checks` job always
  # reports; a path filter here would leave a documentation-only pull request waiting
  # forever for a check that never starts. The `changes` job skips the heavy jobs instead.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - "Dockerfile"
      - "package.json"
      - "src/**"
      - "public/**"
      - "demo/**"
      - "evaluation/**"
      - "infra/**"
      - "scripts/**"
      - "test/**"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Detect application, infrastructure or test changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pushes to main are already filtered by the push trigger's paths.
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Keep in sync with the push trigger's paths filter.
          pattern='^(\.github/workflows/|\.dockerignore$|Dockerfile$|package\.json$|src/|public/|demo/|evaluation/|infra/|scripts/|test/)'
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if grep --quiet --extended-regexp "${pattern}" <<< "${changed}"; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  # Runs on every pull request, including documentation-only ones: a leaked secret or a
  # broken workflow can arrive in any file, and both scans are cheap.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:v8.29.1 git --redact --verbose /repo
      - name: Lint workflows
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" --workdir /repo rhysd/actionlint:1.7.12

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: API regression suite
        run: npm test
      - name: Offline evaluation
        run: npm run evaluate

  container:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1-debian < Dockerfile
      - name: Build image
        run: docker build --tag interview-coach:check .
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --scanners vuln --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL interview-coach:check
      - name: Start container
        run: docker run --detach --name interview-coach-check --publish 8080:8080 interview-coach:check
      - name: Smoke container contract
        run: |
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/health | grep --quiet '"mode":"demo"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health | grep --quiet '"mode":"demo"' || { docker logs interview-coach-check; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet '公開 Demo'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/providers | node -e '
            const body = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (body.deployment?.mode !== "demo") process.exit(1);
            for (const role of ["languageModel", "speech", "jobSource"])
              if (body[role]?.external !== false) process.exit(1);
          '
          test "$(docker exec interview-coach-check /nodejs/bin/node -p 'process.getuid()')" = "65532"
      - name: Stop container
        if: always()
        run: docker rm --force interview-coach-check 2>/dev/null || true

  terraform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate
      - name: Validate service
        run: terraform -chdir=infra/service init -backend=false -input=false && terraform -chdir=infra/service validate

  # The single status check required on main. It passes when every job succeeded or was
  # skipped because nothing relevant changed, and fails on any failure or cancellation.
  required-checks:
    if: always()
    needs: [changes, secrets, test, container, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "A required job finished with: ${result}"; exit 1 ;;
            esac
          done
